<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>叫号系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>智能叫号系统</h1>
        </header>

        <div class="main-content">
            <div class="sidebar">
                <div class="sidebar-section">
                    <h3>系统状态</h3>
                    <div class="status-indicator">
                        <span id="connectionStatus" class="status-dot disconnected"></span>
                        <span id="statusText">未连接</span>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>房间管理</h3>
                    <div class="form-group">
                        <label for="roomId">房间号:</label>
                        <input type="text" id="roomId" value="office-room">
                        <button id="createRoomBtn" class="btn-primary">创建房间</button>
                    </div>
                    <div id="qrcodeContainer" class="qrcode-container">
                        <p>手机扫描二维码加入:</p>
                        <div id="qrcode"></div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>语音设置</h3>
                    <div class="form-group">
                        <label for="voiceSelect">语音选择:</label>
                        <select id="voiceSelect"></select>
                    </div>
                    <div class="form-group">
                        <label for="rateSlider">语速: <span id="rateValue">1.0</span></label>
                        <input type="range" id="rateSlider" min="0.5" max="2" step="0.1" value="1.0">
                    </div>
                    <div class="form-group">
                        <label for="volumeSlider">音量: <span id="volumeValue">1.0</span></label>
                        <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1.0">
                    </div>
                </div>
            </div>

            <div class="content-area">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="call">呼叫管理</button>
                    <button class="tab-btn" data-tab="history">历史记录</button>
                    <button class="tab-btn" data-tab="settings">系统设置</button>
                </div>

                <div class="tab-content">
                    <!-- 呼叫管理标签 -->
                    <div id="callTab" class="tab-pane active">
                        <div class="call-controls">
                            <div class="form-group">
                                <label for="numberInput">输入号码:</label>
                                <input type="number" id="numberInput" placeholder="输入号码">
                                <button id="callBtn" class="btn-call">呼叫</button>
                            </div>
                            <div class="quick-numbers">
                                <h4>快速呼叫</h4>
                                <div class="quick-buttons">
                                    <button class="quick-btn">001</button>
                                    <button class="quick-btn">002</button>
                                    <button class="quick-btn">003</button>
                                    <button class="quick-btn">004</button>
                                    <button class="quick-btn">005</button>
                                </div>
                            </div>
                        </div>
                        <div class="current-call">
                            <h3>当前呼叫</h3>
                            <div id="currentNumber" class="current-number">无</div>
                        </div>
                    </div>

                    <!-- 历史记录标签 -->
                    <div id="historyTab" class="tab-pane">
                        <div class="history-controls">
                            <button id="exportBtn" class="btn-secondary">导出记录</button>
                            <button id="clearHistoryBtn" class="btn-danger">清空记录</button>
                        </div>
                        <div class="history-list-container">
                            <table class="history-table">
                                <thead>
                                    <tr>
                                        <th>时间</th>
                                        <th>号码</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="historyList">
                                    <!-- 历史记录将通过JavaScript动态添加 -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- 系统设置标签 -->
                    <div id="settingsTab" class="tab-pane">
                        <div class="settings-group">
                            <h3>界面设置</h3>
                            <div class="form-group">
                                <label for="themeSelect">主题:</label>
                                <select id="themeSelect">
                                    <option value="light">浅色</option>
                                    <option value="dark">深色</option>
                                    <option value="auto">跟随系统</option>
                                </select>
                            </div>
                        </div>
                        <div class="settings-group">
                            <h3>网络设置</h3>
                            <div class="form-group">
                                <label for="stunServer">STUN服务器:</label>
                                <input type="text" id="stunServer" value="stun:stun.l.google.com:19302">
                            </div>
                        </div>
                        <div class="settings-group">
                            <h3>关于</h3>
                            <p>版本: 1.0.0</p>
                            <p>基于Electron和WebRTC技术构建</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
